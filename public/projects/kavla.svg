<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="KAVLA — abstract architectural composition in black, concrete and signal red">
  <rect width="1200" height="900" fill="#E8E4DC"/>
  <!-- perspective floor grid -->
  <g stroke="#1A1815" stroke-width="2" opacity="0.35">
    <path d="M0 900 L600 480 L1200 900" fill="none"/>
    <path d="M100 900 L600 540 L1100 900 M200 900 L600 600 L1000 900 M300 900 L600 660 L900 900 M400 900 L600 720 L800 900 M500 900 L600 780 L700 900" fill="none"/>
    <path d="M600 480 L600 900 M460 480 L200 900 M740 480 L1000 900 M340 480 L0 820 M860 480 L1200 820 M240 480 L0 640 M960 480 L1200 640" fill="none"/>
  </g>
  <!-- brutalist tower blocks -->
  <g>
    <rect x="430" y="240" width="150" height="420" fill="#1A1815"/>
    <rect x="580" y="330" width="110" height="330" fill="#C9C3B8" stroke="#1A1815" stroke-width="4"/>
    <rect x="690" y="400" width="80" height="260" fill="#FF2E1F"/>
    <rect x="470" y="270" width="24" height="24" fill="#F5F3EF"/>
    <rect x="510" y="270" width="24" height="24" fill="#F5F3EF"/>
    <rect x="470" y="320" width="24" height="24" fill="#F5F3EF"/>
    <rect x="510" y="320" width="24" height="24" fill="#FF2E1F"/>
    <rect x="470" y="370" width="24" height="24" fill="#F5F3EF"/>
    <rect x="510" y="370" width="24" height="24" fill="#F5F3EF"/>
    <rect x="605" y="360" width="18" height="18" fill="#1A1815"/>
    <rect x="640" y="360" width="18" height="18" fill="#1A1815"/>
    <rect x="605" y="400" width="18" height="18" fill="#1A1815"/>
    <rect x="640" y="400" width="18" height="18" fill="#1A1815"/>
  </g>
  <!-- floating lintel -->
  <rect x="360" y="170" width="480" height="14" fill="#1A1815"/>
  <circle cx="840" cy="120" r="56" fill="none" stroke="#FF2E1F" stroke-width="10"/>
  <!-- label strip -->
  <rect x="0" y="820" width="1200" height="80" fill="#1A1815"/>
  <text x="40" y="872" font-family="'JetBrains Mono', monospace" font-size="28" letter-spacing="8" fill="#F5F3EF">KAVLA — ARCH/PORTFOLIO</text>
  <text x="1120" y="872" font-family="'JetBrains Mono', monospace" font-size="28" fill="#FF2E1F">▲</text>
</svg>
